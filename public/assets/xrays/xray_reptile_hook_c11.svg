<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="metalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Coelomic soft tissue / Plastron silhouette -->
  <ellipse cx="400" cy="300" rx="280" ry="220" fill="#1e2d3b" opacity="0.45" filter="url(#glow)"/>
  <ellipse cx="400" cy="300" rx="250" ry="190" fill="#2a3e50" opacity="0.2" />
  <!-- Spine & Ribs / Scutes -->
  <g stroke="#cbd5e1" opacity="0.5" filter="url(#glow)">
    <line x1="400" y1="80" x2="400" y2="520" stroke-width="16" stroke="#e2e8f0" />
    <path d="M 200 200 Q 400 220 600 200" stroke-width="6" fill="none" />
    <path d="M 180 260 Q 400 280 620 260" stroke-width="7" fill="none" />
    <path d="M 180 320 Q 400 340 620 320" stroke-width="7" fill="none" />
    <path d="M 200 380 Q 400 400 600 380" stroke-width="6" fill="none" />
  </g>
  <!-- METALLIC RADIOPAQUE FISHHOOK (Hotspot at x: 400, y: 300) -->
  <g filter="url(#metalGlow)">
    <!-- Starburst metallic scattering artifact -->
    <line x1="320" y1="240" x2="460" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <line x1="460" y1="240" x2="320" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Eye of hook -->
    <circle cx="370" cy="220" r="12" stroke="#ffffff" stroke-width="6" fill="none" />
    <!-- Hook Shank -->
    <line x1="370" y1="232" x2="370" y2="330" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Hook Bend & Barb -->
    <path d="M 370 330 C 370 380, 440 380, 440 320 L 440 280 L 452 295" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: DORSO-VENTRAL (DV) CELOMÁTICA</text>
    <text x="30" y="76">PACIENTE: CAIMAN YACARE / CHELONIA</text>
    <text x="30" y="94">ACHADO: CORPO ESTRANHO RADIOPACO METÁLICO (ANZOL FARPADO EM ESÔFAGO/ESTÔMAGO)</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">DV</text>
  </g>
</svg>