      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Coelomic cavity outline -->
  <ellipse cx="400" cy="300" rx="240" ry="180" fill="#1c2834" opacity="0.4" filter="url(#glow)"/>
  <!-- Vertebral column & Pelvis -->
  <g stroke-linecap="round" filter="url(#glow)">
    <line x1="400" y1="80" x2="400" y2="520" stroke="#e2e8f0" stroke-width="16" />
    <!-- Pelvic girdle ring at posterior -->
    <path d="M 340 450 Q 400 480 460 450" stroke="#cbd5e1" stroke-width="14" fill="none" />
  </g>
  <!-- MULTIPLE CALCIFIED RADIOPAQUE EGGS (Hotspot at x: 400, y: 320) -->
  <g filter="url(#glow)" stroke="#f8fafc" stroke-width="4" fill="#cbd5e1" fill-opacity="0.75">
    <ellipse cx="350" cy="250" rx="36" ry="26" transform="rotate(-15 350 250)" />
    <ellipse cx="450" cy="250" rx="36" ry="26" transform="rotate(15 450 250)" />
    <ellipse cx="330" cy="310" rx="38" ry="28" transform="rotate(5 330 310)" />
    <ellipse cx="470" cy="310" rx="38" ry="28" transform="rotate(-10 470 310)" />
    <ellipse cx="400" cy="280" rx="37" ry="27" fill="#ffffff" fill-opacity="0.9" />
    <!-- Impacted eggs near pelvic brim -->
    <ellipse cx="360" cy="375" rx="38" ry="28" transform="rotate(-20 360 375)" fill="#f8fafc" fill-opacity="0.85" />
    <ellipse cx="440" cy="375" rx="38" ry="28" transform="rotate(20 440 375)" fill="#f8fafc" fill-opacity="0.85" />
    <ellipse cx="400" cy="420" rx="35" ry="26" fill="#ffffff" stroke-width="5" />
  </g>
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: VENTRO-DORSAL (VD) CELOMÁTICA</text>
    <text x="30" y="76">PACIENTE: SALVATOR MERIANAE (TEIÚ) / IGUANA</text>
    <text x="30" y="94">ACHADO: RETENÇÃO DE 8 OVOS CALCIFICADOS COM IMPACTAÇÃO EM CANAL PÉLVICO (DISTOCIA)</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">VD</text>
  </g>
</svg>