<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Serpentine Body silhouette -->
  <path d="M 100 150 Q 250 80 400 150 T 700 220 Q 750 350 600 400 T 200 460" fill="none" stroke="#1e2d3b" stroke-width="110" opacity="0.45" filter="url(#glow)" />
  <!-- Serpentine Vertebrae column -->
  <path d="M 100 150 Q 250 80 400 150 T 700 220 Q 750 350 600 400 T 200 460" fill="none" stroke="#e2e8f0" stroke-width="16" stroke-dasharray="12 4" filter="url(#glow)" />
  <!-- Fine ribs -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.6">
    <line x1="380" y1="100" x2="420" y2="200" />
    <line x1="410" y1="105" x2="450" y2="205" />
    <line x1="440" y1="115" x2="480" y2="215" />
  </g>
  <!-- OBSTRUCTIVE RADIOPAQUE MASS (Hotspot at x: 420, y: 280) -->
  <g filter="url(#glow)">
    <!-- Concentric dense mineralized obstruction -->
    <ellipse cx="420" cy="280" rx="55" ry="42" fill="#f8fafc" opacity="0.9" />
    <ellipse cx="420" cy="280" rx="45" ry="32" fill="#ffffff" />
    <ellipse cx="415" cy="275" rx="25" ry="18" fill="#e2e8f0" />
    <!-- Intestinal distension / Gas pocket adjacent -->
    <ellipse cx="490" cy="275" rx="25" ry="20" fill="#020406" stroke="#64748b" stroke-width="2" />
  </g>
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: DORSOVENTRAL TOTAL BODY</text>
    <text x="30" y="76">PACIENTE: BOA CONSTRICTOR / LEOPARDUS</text>
    <text x="30" y="94">ACHADO: MASSA RADIOPACA MINERALIZADA COM OBSTRUÇÃO E DISTENSÃO GASOSA A MONTANTE</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">DV</text>
  </g>
</svg>