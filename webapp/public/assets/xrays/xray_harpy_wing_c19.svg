<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Wing soft tissue -->
  <path d="M 100 240 C 200 180, 350 200, 500 240 C 620 280, 720 320, 700 380 C 600 420, 420 390, 300 370 C 180 340, 120 300, 100 240 Z" fill="#1c2834" opacity="0.4" filter="url(#glow)"/>
  <!-- Humerus (Large pneumatic avian bone) -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M 140 310 Q 230 240 320 270" stroke-width="22" stroke="#edf2f7" />
    <circle cx="140" cy="310" r="18" fill="#e2e8f0" />
    <circle cx="320" cy="270" r="17" fill="#e2e8f0" />
  </g>
  <!-- Proximal Ulna & Radius -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M 325 285 L 400 305" stroke-width="14" stroke="#f8fafc" />
    <path d="M 322 258 L 395 278" stroke-width="9" stroke="#cbd5e1" />
  </g>
  <!-- FRACTURE SITE (Hotspot at x: 410, y: 310) -->
  <g filter="url(#glow)">
    <line x1="395" y1="295" x2="415" y2="325" stroke="#040608" stroke-width="7" />
    <line x1="392" y1="268" x2="408" y2="292" stroke="#040608" stroke-width="6" />
    <polygon points="398,300 410,292 414,308 402,314" fill="#ffffff" />
  </g>
  <!-- Distal Displaced Ulna & Radius -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M 420 320 L 550 350" stroke-width="13" stroke="#e2e8f0" />
    <path d="M 415 290 L 545 325" stroke-width="9" stroke="#cbd5e1" />
    <circle cx="550" cy="350" r="12" fill="#e2e8f0" />
    <circle cx="545" cy="325" r="10" fill="#cbd5e1" />
    <!-- Metacarpus & Primary feathers anchor -->
    <path d="M 555 340 L 650 355" stroke-width="12" stroke="#cbd5e1" />
    <path d="M 650 355 L 700 365" stroke-width="7" stroke="#94a3b8" />
  </g>
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: CAUDO-CRANIAL (CdCr) ASA ESQUERDA</text>
    <text x="30" y="76">PACIENTE: HARPIA HARPYJA (GAVIÃO-REAL)</text>
    <text x="30" y="94">ACHADO: FRATURA COM DESVIO EM DIÁFISE DE RÁDIO E ULNA</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">L</text>
  </g>
</svg>