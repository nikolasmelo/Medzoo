<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Soft tissue thighs -->
  <path d="M 100 120 Q 220 80 400 100 Q 580 80 700 120 L 680 500 Q 400 550 120 500 Z" fill="#1c2834" opacity="0.4" filter="url(#glow)"/>
  <!-- Pelvic Girdle -->
  <g stroke="#edf2f7" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Ilium wings -->
    <path d="M 260 160 Q 320 180 390 190 Q 460 180 520 160" stroke-width="16" />
    <!-- Sacrum & Spine vertebrae -->
    <path d="M 390 120 L 390 280" stroke-width="22" stroke="#e2e8f0" />
    <!-- Ischium & Pubis arches -->
    <ellipse cx="330" cy="260" rx="45" ry="35" stroke-width="10" stroke="#cbd5e1" />
    <ellipse cx="450" cy="260" rx="45" ry="35" stroke-width="10" stroke="#cbd5e1" />
    <!-- Acetabulum L & R -->
    <circle cx="280" cy="260" r="20" stroke-width="12" stroke="#f1f5f9" />
    <circle cx="500" cy="260" r="20" stroke-width="12" stroke="#f1f5f9" />
  </g>
  <!-- Left Normal Femur (Patient Right) -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M 280 270 Q 240 370 230 480" stroke-width="22" stroke="#e2e8f0" />
  </g>
  <!-- Right Injured Femur: Comminuted Fracture (Hotspot at x: 500, y: 360) -->
  <g stroke-linecap="round" filter="url(#glow)">
    <!-- Proximal Femoral Shaft -->
    <path d="M 500 270 L 495 330" stroke-width="24" stroke="#f8fafc" />
    <!-- Fracture fragments / Bone shards -->
    <polygon points="485,340 505,335 498,355 480,350" fill="#ffffff" />
    <polygon points="510,345 530,350 518,365 505,358" fill="#e2e8f0" />
    <polygon points="475,360 495,365 488,380 470,375" fill="#cbd5e1" />
    <polygon points="502,370 522,375 515,390 495,385" fill="#f8fafc" />
    <!-- Displaced Distal Femoral Shaft -->
    <path d="M 515 395 Q 545 440 550 500" stroke-width="22" stroke="#e2e8f0" />
    <!-- Fracture Gap line -->
    <line x1="470" y1="355" x2="535" y2="365" stroke="#040608" stroke-width="8" />
  </g>
  <!-- Text HUD -->
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: VENTRO-DORSAL (VD) PELVIS</text>
    <text x="30" y="76">PACIENTE: PANTHERA ONCA / CHRYSOCYON</text>
    <text x="30" y="94">ACHADO: FRATURA COMINUTIVA DIAFISÁRIA FEMORAL DIREITA</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">R</text>
  </g>
</svg>