<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="boneGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background / Radiographic Film -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Soft tissue silhouette (radiolucent halo) -->
  <path d="M 120 220 C 180 180, 290 190, 380 230 C 470 270, 560 270, 680 320 C 640 380, 530 400, 420 370 C 330 350, 220 360, 150 320 Z" fill="#16222c" opacity="0.4" filter="url(#glow)" />
  <path d="M 140 230 C 200 200, 280 210, 360 240 C 440 270, 540 280, 640 320 C 600 360, 500 370, 400 350 C 310 330, 210 330, 160 300 Z" fill="#223240" opacity="0.35" filter="url(#glow)" />

  <!-- Coracoid & Clavicle (Furcula) -->
  <g stroke="#c8d6e5" stroke-linecap="round" opacity="0.7" filter="url(#boneGlow)">
    <path d="M 100 260 Q 140 270 170 290" stroke-width="12" />
    <path d="M 110 310 Q 145 300 170 290" stroke-width="10" />
  </g>

  <!-- Humerus (Dense bone) -->
  <g stroke="#dce7f2" stroke-linecap="round" filter="url(#boneGlow)">
    <path d="M 170 290 Q 240 240 310 260" stroke-width="18" stroke="#edf2f7" />
    <circle cx="170" cy="290" r="16" fill="#e2e8f0" />
    <circle cx="310" cy="260" r="15" fill="#e2e8f0" />
    <!-- Condyle -->
    <path d="M 300 250 Q 325 260 315 275" stroke-width="8" stroke="#f8fafc" />
  </g>

  <!-- Proximal Radius & Ulna (Before fracture) -->
  <g stroke-linecap="round" filter="url(#boneGlow)">
    <!-- Ulna proximal -->
    <path d="M 315 275 L 390 295" stroke-width="12" stroke="#e2e8f0" />
    <!-- Radius proximal -->
    <path d="M 312 250 L 385 268" stroke-width="8" stroke="#edf2f7" />
  </g>

  <!-- FRACTURE SITE (Hotspot at x: 400, y: 300) -->
  <g filter="url(#boneGlow)">
    <!-- Fracture Gap / Discontinuity -->
    <line x1="390" y1="285" x2="405" y2="315" stroke="#060a0e" stroke-width="6" />
    <line x1="385" y1="258" x2="398" y2="282" stroke="#060a0e" stroke-width="5" />
    
    <!-- Bone Fragments / Cortical Steps -->
    <polygon points="388,290 398,280 404,295 394,302" fill="#cbd5e1" />
    <polygon points="382,263 392,258 395,270 385,274" fill="#cbd5e1" />
  </g>

  <!-- Distal Radius & Ulna (Displaced after fracture) -->
  <g stroke-linecap="round" filter="url(#boneGlow)">
    <!-- Ulna distal (angled downwards) -->
    <path d="M 410 310 L 520 340" stroke-width="11" stroke="#e2e8f0" />
    <!-- Radius distal (shifted upwards) -->
    <path d="M 405 280 L 515 315" stroke-width="8" stroke="#edf2f7" />
    
    <!-- Carpal bones & Manus / Metacarpus -->
    <circle cx="520" cy="340" r="10" fill="#e2e8f0" />
    <circle cx="515" cy="315" r="9" fill="#e2e8f0" />
    <path d="M 525 330 L 610 345" stroke-width="10" stroke="#cbd5e1" />
    <path d="M 610 345 L 660 355" stroke-width="6" stroke="#94a3b8" />
    <!-- Digits / Phalanges -->
    <path d="M 610 340 L 650 330" stroke-width="4" stroke="#94a3b8" />
  </g>

  <!-- Medical Digital Overlay -->
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: LATERAL ALAR ESQUERDA</text>
    <text x="30" y="76">PACIENTE: ARA ARARAUNA / STRIGIFORMES</text>
    <text x="30" y="94">kV: 45 | mAs: 2.5 | FOV: 24cm</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">L</text>
    <text x="720" y="570">10 cm</text>
    <line x1="710" y1="555" x2="760" y2="555" stroke="#38bdf8" stroke-width="2" />
  </g>
</svg>