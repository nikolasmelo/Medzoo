<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="60%" stop-color="#040608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Leg soft tissue outline -->
  <path d="M 320 60 C 440 80 500 160 480 300 C 460 420 440 500 360 560 C 280 520 260 400 270 280 C 280 160 260 80 320 60 Z" fill="#1c2834" opacity="0.4" filter="url(#glow)"/>
  <!-- Proximal femur & hip joint -->
  <g stroke-linecap="round" filter="url(#glow)">
    <circle cx="360" cy="140" r="24" fill="#e2e8f0" />
    <path d="M 360 140 L 375 270" stroke-width="28" stroke="#edf2f7" />
  </g>
  <!-- Fracture Line (Hotspot at x: 380, y: 290) -->
  <g filter="url(#glow)">
    <line x1="345" y1="265" x2="405" y2="295" stroke="#040608" stroke-width="7" />
    <!-- Cortical sharp edges -->
    <polygon points="350,265 375,270 365,280" fill="#f8fafc" />
    <polygon points="375,285 400,290 390,305" fill="#cbd5e1" />
  </g>
  <!-- Distal femur & Stifle/Patella -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M 385 295 L 395 430" stroke-width="26" stroke="#e2e8f0" />
    <!-- Condyles & Patella -->
    <circle cx="385" cy="435" r="20" fill="#e2e8f0" />
    <circle cx="410" cy="435" r="18" fill="#e2e8f0" />
    <circle cx="370" cy="415" r="10" fill="#cbd5e1" />
    <!-- Tibia proximal -->
    <path d="M 395 450 L 380 540" stroke-width="22" stroke="#cbd5e1" />
  </g>
  <g font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.75">
    <text x="30" y="40">MEDZOO RADIOLOGY SYS-DIGITAL</text>
    <text x="30" y="58">PROJ: ML (MÉDIO-LATERAL) MEMBRO PÉLVICO</text>
    <text x="30" y="76">PACIENTE: MYRMECOPHAGA TRIDACTYLA (TAMANDUÁ-BANDEIRA)</text>
    <text x="30" y="94">ACHADO: FRATURA OBLÍQUA DIAFISÁRIA DE FÊMUR</text>
    <text x="740" y="40" font-size="24" font-weight="bold" fill="#f8fafc">L</text>
  </g>
</svg>